project_id = "unfurl-dev"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your Unfurl account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Unfurl password"
content_path = "./supabase/templates/recovery.html"

# Configure a real SMTP sender in the selected Supabase project before public use.
# The hosted default sender only supports pre-authorized test recipients.
# Change exact Site URL / callback URLs deliberately when a deployment is authorized.
